<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boeuf Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">Boeuf Tracker</div>
        <div class="meta">
            <span id="meta-source">source: --</span>
            <span class="sep">/</span>
            <span id="meta-device">device: --</span>
            <span class="sep">/</span>
            <span id="meta-fps">fps: --</span>
            <span class="sep">/</span>
            <span id="meta-frames">frames: 0</span>
            <span class="sep">/</span>
            <span id="meta-started">démarré: --</span>
        </div>
    </header>

    <div class="source-bar">
        <span class="source-label">Source:</span>
        <input type="file" id="video-input" accept="video/*" style="display:none">
        <button id="btn-upload" class="btn">Charger une vidéo</button>
        <button id="btn-webcam" class="btn btn-secondary">Webcam</button>
        <span id="current-source" class="current-source">--</span>

        <span class="source-sep">|</span>

        <span class="source-label">Device:</span>
        <select id="device-select" class="device-select">
            <option value="auto">Auto</option>
        </select>
        <span id="device-status" class="device-status"></span>

        <span id="upload-status" class="upload-status"></span>
    </div>

    <main class="layout">
        <section class="video-panel">
            <div class="video-frame">
                <img id="stream" src="{{ url_for('video_feed') }}" alt="flux video">
            </div>
            <div class="legend">
                <span class="dot dot-green"></span> bovin identifié
            </div>
        </section>

        <aside class="side-panel">
            <div class="card">
                <div class="card-title">Animaux détectés</div>
                <div class="card-sub"><span id="active-count">0</span> actuellement visibles</div>
                <ul id="animal-list" class="animal-list">
                    <li class="empty">Aucun animal visible</li>
                </ul>
            </div>

            <div class="card">
                <div class="card-title">Journal</div>
                <div class="card-sub">Derniers événements</div>
                <ul id="event-list" class="event-list">
                    <li class="empty">Aucun événement</li>
                </ul>
            </div>
        </aside>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        let lastSource = '';

        async function refreshStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                const sourceLabel = data.source_label || data.source || '--';
                $('meta-source').textContent = 'source: ' + sourceLabel;
                $('meta-device').textContent = 'device: ' + (data.device || '--');
                $('meta-fps').textContent = 'fps: ' + (data.fps || 0).toFixed(1);
                $('meta-frames').textContent = 'frames: ' + (data.frame_count || 0);
                $('meta-started').textContent = 'démarré: ' + (data.started_at || '--');
                $('current-source').textContent = '→ ' + sourceLabel;

                // Si la source a changé, forcer la reconnexion du flux MJPEG
                if (sourceLabel !== lastSource) {
                    const img = document.getElementById('stream');
                    img.src = '{{ url_for('video_feed') }}?t=' + Date.now();
                    lastSource = sourceLabel;
                }

                // Synchroniser le select device si le serveur a changé
                if (!switchingDevice && data.device && deviceSelect.value !== data.device) {
                    const opts = Array.from(deviceSelect.options).map(o => o.value);
                    if (opts.includes(data.device)) {
                        deviceSelect.value = data.device;
                    }
                }

                // Animaux actifs
                const list = $('animal-list');
                const active = data.active || [];
                $('active-count').textContent = active.length;
                if (active.length === 0) {
                    list.innerHTML = '<li class="empty">Aucun animal visible</li>';
                } else {
                    list.innerHTML = active.map(a => `
                        <li>
                            <span class="animal-name">${a.name}</span>
                            <span class="animal-conf">${(a.conf * 100).toFixed(0)}%</span>
                        </li>
                    `).join('');
                }

                // Événements
                const events = $('event-list');
                const ev = data.events || [];
                if (ev.length === 0) {
                    events.innerHTML = '<li class="empty">Aucun événement</li>';
                } else {
                    events.innerHTML = ev.map(e => {
                        const cls = e.startsWith('NEW') ? 'ev-new' : 'ev-match';
                        return `<li class="${cls}">${e}</li>`;
                    }).join('');
                }
            } catch (e) {
                // silencieux
            }
        }

        setInterval(refreshStats, 1000);
        refreshStats();

        // Upload vidéo
        document.getElementById('btn-upload').addEventListener('click', () => {
            document.getElementById('video-input').click();
        });

        document.getElementById('video-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('upload-status');
            const sizeMB = (file.size / 1024 / 1024).toFixed(1);
            status.textContent = `Envoi de ${file.name} (${sizeMB} MB)...`;
            status.className = 'upload-status upload-pending';

            const formData = new FormData();
            formData.append('video', file);

            try {
                const res = await fetch('/api/upload-video', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.ok) {
                    status.textContent = `Chargé: ${data.filename}`;
                    status.className = 'upload-status upload-ok';
                } else {
                    status.textContent = `Erreur: ${data.error || 'inconnue'}`;
                    status.className = 'upload-status upload-err';
                }
            } catch (err) {
                status.textContent = `Erreur réseau: ${err.message}`;
                status.className = 'upload-status upload-err';
            }
            // Reset input pour pouvoir recharger le même fichier
            e.target.value = '';
        });

        // Switch webcam
        document.getElementById('btn-webcam').addEventListener('click', async () => {
            const status = document.getElementById('upload-status');
            status.textContent = 'Bascule vers webcam...';
            status.className = 'upload-status upload-pending';
            try {
                const res = await fetch('/api/source/webcam', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const data = await res.json();
                if (data.ok) {
                    status.textContent = '';
                    status.className = 'upload-status';
                }
            } catch (err) {
                status.textContent = `Erreur: ${err.message}`;
                status.className = 'upload-status upload-err';
            }
        });

        // Gestion device (CPU/GPU)
        const deviceSelect = document.getElementById('device-select');
        const deviceStatus = document.getElementById('device-status');
        let switchingDevice = false;

        async function loadDevices() {
            try {
                const res = await fetch('/api/devices');
                const data = await res.json();
                deviceSelect.innerHTML = '';
                // Auto
                const optAuto = document.createElement('option');
                optAuto.value = 'auto';
                optAuto.textContent = 'Auto';
                deviceSelect.appendChild(optAuto);
                // Devices disponibles
                data.available.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    if (d === 'cpu') {
                        opt.textContent = 'CPU';
                    } else if (d.startsWith('cuda:')) {
                        const idx = d.split(':')[1];
                        const gpu = (data.gpus || []).find(g => String(g.index) === idx);
                        opt.textContent = gpu ? `GPU ${idx} (${gpu.name.split(' ').slice(-2).join(' ')})` : `GPU ${idx}`;
                    } else {
                        opt.textContent = d.toUpperCase();
                    }
                    deviceSelect.appendChild(opt);
                });
                deviceSelect.value = data.current;
            } catch (e) {
                // silencieux
            }
        }
        loadDevices();

        deviceSelect.addEventListener('change', async () => {
            if (switchingDevice) return;
            switchingDevice = true;
            const target = deviceSelect.value;
            deviceStatus.textContent = 'bascule...';
            deviceStatus.className = 'device-status pending';
            try {
                const res = await fetch('/api/device', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device: target })
                });
                const data = await res.json();
                if (data.ok) {
                    deviceStatus.textContent = `→ ${data.device}`;
                    deviceStatus.className = 'device-status ok';
                    // Recharger la liste pour refléter le device actif
                    await loadDevices();
                    deviceSelect.value = data.device;
                } else {
                    deviceStatus.textContent = data.error || 'erreur';
                    deviceStatus.className = 'device-status err';
                }
            } catch (err) {
                deviceStatus.textContent = `réseau: ${err.message}`;
                deviceStatus.className = 'device-status err';
            } finally {
                setTimeout(() => { switchingDevice = false; }, 500);
            }
        });
    </script>
</body>
</html>
