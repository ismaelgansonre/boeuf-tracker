<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boeuf Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --text: #e8eaed;
    --text-muted: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo {
    width: 96px; height: 96px;
    background: var(--accent);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; font-weight: 800;
    color: #fff;
    margin-bottom: 2rem;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.92); opacity: 0.8; }
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
  .status {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-family: ui-monospace, "SF Mono", monospace;
    min-height: 1.2em;
  }
  .spinner {
    margin-top: 2rem;
    width: 32px; height: 32px;
    border: 3px solid rgba(22, 163, 74, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">BT</div>
  <h1>Boeuf Tracker</h1>
  <p class="status" id="status">Initialisation...</p>
  <div class="spinner"></div>

<script>
// Affiche l'etat de chargement. Le code Rust naviguera vers le worker
// (http://127.0.0.1:8100) une fois qu'il sera pret, ce qui remplacera
// cette page automatiquement.
const messages = [
  "Chargement des modeles MLX...",
  "Initialisation YOLO26 (Metal GPU)...",
  "Chargement DINOv2 (Re-ID)...",
  "Chargement CLIP (reconnaissance de races)...",
  "Demarrage de la boucle de detection...",
];
let i = 0;
const el = document.getElementById('status');
setInterval(() => {
  el.textContent = messages[i % messages.length];
  i++;
}, 2500);
</script>
</body>
</html>
